name: Build iOS IPA (Sideload)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        default: "cmp-rewrite"

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: false   # do NOT auto-recurse; libass-android has no URL

      # ── 1b. Init only valid submodules ───────────────────────────────────────
      #    libass-android is listed as a path in .gitmodules but has no URL,
      #    so `submodules: recursive` crashes with exit code 128.
      #    We strip it out temporarily and only init the real submodules (MPVKit).
      - name: Init valid submodules only
        run: |
          # Remove the broken entry from .gitmodules before initialising
          git config --file .gitmodules --remove-section submodule.libass-android 2>/dev/null || true
          git config --file .gitmodules --remove-section submodule.stremio-community-v5 2>/dev/null || true
          git submodule sync
          git submodule update --init --recursive --depth=1

      # ── 2. Java (required by Gradle / KMP) ──────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Gradle cache ──────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 4. CocoaPods cache ──────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: iosApp/Pods
          key: pods-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: pods-

      # ── 5. Build shared Kotlin/iOS framework ─────────────────────────────────
      #    This compiles the KMP shared code into a .xcframework that Xcode uses.
      - name: Build Kotlin shared framework (arm64 device)
        run: ./gradlew :composeApp:assembleXCFramework -Pkotlin.native.cacheKind=none --stacktrace
        # If the above task name doesn't exist in your fork, try:
        #   ./gradlew :composeApp:linkReleaseFrameworkIosArm64
        # Check available tasks with:  ./gradlew :composeApp:tasks | grep -i ios

      # ── 6. Install CocoaPods dependencies ────────────────────────────────────
      - name: Install CocoaPods
        working-directory: iosApp
        run: |
          gem install cocoapods --no-document 2>/dev/null || true
          pod install --repo-update

      # ── 7. Build & archive (no signing) ─────────────────────────────────────
      #    CODE_SIGN_IDENTITY="" and CODE_SIGNING_REQUIRED=NO produce an
      #    unsigned archive that can be repacked into an IPA for sideloading.
      - name: Build Xcode archive
        run: |
          xcodebuild archive \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ${{ runner.temp }}/NuvioMobile.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true
        # xcpretty makes logs readable; the '|| true' lets the step continue
        # so we can see failures clearly. Remove it if you want strict failure.

      # ── 8. Package the .xcarchive into an IPA ────────────────────────────────
      #    We manually create the Payload/ structure that constitutes an IPA.
      #    This is the standard sideloading technique (AltStore, Sideloadly, etc.)
      - name: Package IPA from archive
        run: |
          APP_PATH=$(find ${{ runner.temp }}/NuvioMobile.xcarchive/Products/Applications -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"

          mkdir -p ${{ runner.temp }}/Payload
          cp -r "$APP_PATH" ${{ runner.temp }}/Payload/

          cd ${{ runner.temp }}
          zip -r NuvioMobile.ipa Payload/
          echo "IPA created: $(du -sh NuvioMobile.ipa | cut -f1)"

      # ── 9. Upload IPA as workflow artifact ───────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/NuvioMobile.ipa
          retention-days: 30
          if-no-files-found: error

      # ── 10. (Optional) Upload the full .xcarchive for debugging ──────────────
      - name: Upload xcarchive (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-xcarchive-${{ github.run_number }}
          path: ${{ runner.temp }}/NuvioMobile.xcarchive
          retention-days: 7
