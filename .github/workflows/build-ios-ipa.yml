name: Build iOS Sideloadable IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab
  push:
    branches: [ "main", "master", "cmp-rewrite" ]

jobs:
  build-ios:
    runs-on: macos-14 # macOS runner equipped with Xcode 15+

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE=""

      - name: Package as Sideloadable IPA
        run: |
          mkdir Payload
          cp -r build-derived/Build/Products/Release-iphoneos/*.app Payload/
          zip -r NuvioMobile.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-sideloadable-ipa
          path: NuvioMobile.ipa
          retention-days: 7
